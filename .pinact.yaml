# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
# pinact - https://github.com/suzuki-shunsuke/pinact
version: 3
rules:
  # These actions publish no current releases and are meant to track their
  # default branch. They are pinned by hand to a commit on that branch.
  - ignore: true
    conditions:
      - expr: |
          ActionName == "hacs/action"
      - expr: |
          ActionName == "home-assistant/actions/hassfest"
