name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch new checks in hassfest and HACS without waiting for a commit.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - run: uv sync --locked
      - run: mise run lint
      - run: mise run test -- --cov-fail-under=95
